<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مَعْن فَطَايِر | الأثر الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.08); 
            --hover: rgba(255, 255, 255, 0.15); 
        }
        body { 
            margin: 0; 
            background: #080808; 
            color: #e0e0e0; 
            font-family: 'Cairo', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .card { 
            width: 100%; 
            max-width: 420px; 
            background: var(--glass); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 30px; 
            padding: 40px 30px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
        }
        h1 { font-size: 2rem; margin: 0 0 10px; letter-spacing: -1px; color: #fff; }
        p { color: #888; margin-bottom: 35px; font-weight: 300; }
        
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            background: var(--glass); 
            border: 1px solid rgba(255,255,255,0.05); 
            padding: 16px; 
            margin-bottom: 15px; 
            border-radius: 20px; 
            color: #fff; 
            text-decoration: none; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-weight: 400; 
        }
        .btn:hover { 
            background: var(--hover); 
            transform: translateY(-5px); 
            border-color: rgba(255,255,255,0.2); 
        }
        
        .qr-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .qr-section img { background: #fff; padding: 10px; border-radius: 15px; width: 140px; }
        
        .footer { margin-top: 50px; color: #444; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h1>مَعْن فَطَايِر</h1>
    <p>المساحة الرقمية الخاصة للخواطر والمعلومات</p>
    
    <a href="mailto:alnablsyyousef@gmail.com" class="btn"><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</a>
    <a href="https://youtube.com/@maanfatayer2105" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> قناة اليوتيوب</a>
    <a href="https://www.facebook.com/share/1D9H3s7Yjt/" target="_blank" class="btn"><i class="fa-brands fa-facebook-f"></i> فيس بوك</a>
    <a href="https://x.com/AnFatayer99756" target="_blank" class="btn"><i class="fa-brands fa-x-twitter"></i> حسابي على X</a>

    <div class="qr-section">
        <p style="font-size: 0.8rem;">امسح للوصول السريع</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://alnablsyyousef-cloud.github.io/maan-fatayer/" alt="QR Code">
    </div>
</div>

<div class="footer">
    <i class="fa-solid fa-gear"></i>
    <span>جميع الحقوق محفوظة © مَعْن فَطَايِر 2026</span>
</div>

</body>
</html>
